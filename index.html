<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Tour App Download</title>
    <!-- Futuristic Gaming Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;500;700&display=swap" rel="stylesheet">
    
    <style>
        /* === BASE & CSS RESET === */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            user-select: none;
        }

        :root {
            --bg-color: #03030a;
            --neon-blue: #00f3ff;
            --neon-purple: #bc13fe;
            --neon-pink: #ff107a;
            --neon-orange: #ff6a00; /* Free Fire Vibe */
            --font-title: 'Orbitron', sans-serif;
            --font-body: 'Rajdhani', sans-serif;
        }

        body, html {
            width: 100%;
            height: 100%;
            background-color: var(--bg-color);
            color: #fff;
            overflow: hidden;
            font-family: var(--font-body);
            perspective: 1000px;
        }

        /* === BACKGROUND LAYERS === */
        #canvas-container {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            z-index: 0;
        }

        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 80vw; height: 80vw;
            background: radial-gradient(circle, rgba(255, 106, 0, 0.08) 0%, rgba(0, 243, 255, 0.04) 40%, transparent 70%);
            transform: translate(-50%, -50%);
            z-index: 1;
            animation: pulse-glow 8s ease-in-out infinite alternate;
        }

        .fog-container {
            position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            z-index: 2;
            pointer-events: none;
            opacity: 0.4;
            background: 
                radial-gradient(circle at 20% 30%, rgba(0, 243, 255, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, rgba(255, 106, 0, 0.06) 0%, transparent 40%);
            filter: blur(40px);
            animation: drift 25s linear infinite;
        }

        .streaks-container {
            position: absolute;
            width: 100%; height: 100%;
            z-index: 3;
            pointer-events: none;
        }

        .streak {
            position: absolute;
            background: linear-gradient(90deg, transparent, var(--neon-orange), #fff, var(--neon-orange), transparent);
            height: 2px;
            width: 150px;
            opacity: 0;
            filter: drop-shadow(0 0 10px var(--neon-orange));
            animation: shoot-streak 4s infinite;
            will-change: transform, opacity;
        }

        /* === CENTERPIECE CARD (Glassmorphism Pro Max) === */
        .main-container {
            position: relative;
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%; height: 100%;
            animation: cinematic-intro 2.5s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .glass-card {
            position: relative;
            width: 90%;
            max-width: 500px;
            padding: 50px 30px;
            border-radius: 30px;
            background: rgba(10, 15, 30, 0.35); 
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.8), 
                inset 0 0 20px rgba(255, 255, 255, 0.05),
                0 0 40px rgba(255, 106, 0, 0.1),
                0 0 80px rgba(0, 243, 255, 0.05);
            text-align: center;
            transform-style: preserve-3d;
            transition: box-shadow 0.3s ease;
        }

        .glass-card:hover {
            box-shadow: 
                0 30px 60px rgba(0, 0, 0, 0.9), 
                inset 0 0 30px rgba(255, 255, 255, 0.08),
                0 0 60px rgba(255, 106, 0, 0.2),
                0 0 120px rgba(0, 243, 255, 0.15);
        }

        /* === CIRCULAR IMAGE WITH ANIMATED BORDER === */
        .profile-wrapper {
            position: relative;
            width: 130px;
            height: 130px;
            margin: 0 auto 25px auto;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            transform: translateZ(60px); 
        }

        .profile-anim-border {
            position: absolute;
            inset: -4px; 
            border-radius: 50%;
            background: conic-gradient(from 0deg, var(--neon-orange), var(--neon-pink), var(--neon-blue), var(--neon-orange));
            animation: spin 3s linear infinite;
            z-index: 1;
            filter: blur(4px); 
        }

        .profile-img {
            position: relative;
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            z-index: 2;
            border: 4px solid #0a0f1e; 
            box-shadow: inset 0 0 20px rgba(0,0,0,0.5);
        }

        /* Inner Content */
        .title {
            font-family: var(--font-title);
            font-size: 2.8rem;
            font-weight: 900;
            line-height: 1.1;
            margin-bottom: 12px;
            background: linear-gradient(to right, var(--neon-orange), #fff, var(--neon-pink), var(--neon-blue), var(--neon-orange));
            background-size: 200% auto;
            color: transparent;
            -webkit-background-clip: text;
            background-clip: text;
            animation: gradient-shimmer 4s linear infinite;
            filter: drop-shadow(0 0 10px rgba(255, 106, 0, 0.3));
            transform: translateZ(50px);
            text-transform: uppercase;
        }

        .subtitle {
            font-size: 1.25rem;
            font-weight: 500;
            color: rgba(255, 255, 255, 0.85);
            letter-spacing: 1px;
            line-height: 1.4;
            margin-bottom: 40px;
            transform: translateZ(30px);
            animation: fade-in-up 1s ease 1s forwards;
            opacity: 0;
            padding: 0 10px;
        }

        /* === CTA BUTTON (SOLID FIX) === */
        .cta-container {
            transform: translateZ(50px);
        }

        .cta-btn {
            position: relative;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            width: 260px;
            height: 65px;
            font-family: var(--font-title);
            font-weight: 700;
            font-size: 1.1rem;
            letter-spacing: 2.5px;
            color: #fff;
            text-decoration: none; 
            background: transparent;
            border: none;
            border-radius: 40px;
            cursor: pointer;
            overflow: hidden;
            outline: none;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            text-transform: uppercase;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
            z-index: 1;
        }

        .cta-btn::before {
            content: '';
            position: absolute;
            top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: conic-gradient(from 0deg, transparent 0%, transparent 60%, var(--neon-orange) 70%, var(--neon-pink) 85%, var(--neon-blue) 100%);
            animation: spin 2.5s linear infinite;
            z-index: -2;
        }

        /* Solid background inside button */
        .cta-btn::after {
            content: '';
            position: absolute;
            inset: 3px; 
            background: rgba(13, 19, 38, 1); /* Solid dark color */
            border-radius: 35px;
            z-index: -1;
            transition: background 0.3s ease;
        }

        .cta-btn span {
            position: relative;
            z-index: 2;
            pointer-events: none;
            color: #fff;
            text-shadow: 0 0 8px rgba(255, 255, 255, 0.6); 
            transition: text-shadow 0.3s ease, transform 0.3s ease;
        }

        .cta-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 25px rgba(255, 106, 0, 0.4), 0 0 50px rgba(0, 243, 255, 0.2);
        }

        .cta-btn:active {
            transform: scale(0.98);
        }

        .cta-btn:hover::after {
            background: rgba(21, 28, 51, 1);
        }

        .cta-btn:hover span {
            text-shadow: 0 0 15px rgba(255, 255, 255, 1);
            transform: scale(1.02);
        }

        .footer-text {
            font-size: 0.8rem;
            color: rgba(255,255,255,0.4);
            margin-top: 20px;
            transform: translateZ(20px);
            animation: fade-in-up 1s ease 1.5s forwards;
            opacity: 0;
            letter-spacing: 1px;
        }

        .ripple {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.6);
            transform: scale(0);
            animation: ripple-anim 0.6s linear;
            pointer-events: none;
            z-index: 1;
        }

        #cursor-flare {
            position: fixed;
            top: 0; left: 0;
            width: 400px; height: 400px;
            background: radial-gradient(circle, rgba(0, 243, 255, 0.15) 0%, rgba(255, 106, 0, 0.05) 30%, transparent 60%);
            border-radius: 50%;
            pointer-events: none;
            transform: translate(-50%, -50%);
            z-index: 5;
            transition: opacity 0.3s ease;
            mix-blend-mode: screen;
        }

        .global-shockwave {
            position: fixed;
            border-radius: 50%;
            border: 2px solid transparent;
            pointer-events: none;
            transform: translate(-50%, -50%) scale(0);
            animation: shockwave-expand 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            z-index: 9999;
        }

        /* === ANIMATIONS === */
        @keyframes drift {
            0% { transform: translate(0, 0) rotate(0deg); }
            50% { transform: translate(5%, 5%) rotate(5deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }

        @keyframes gradient-shimmer {
            0% { background-position: 0% 50%; }
            100% { background-position: 200% 50%; }
        }

        @keyframes shoot-streak {
            0% { transform: translateX(-100vw) rotate(15deg); opacity: 0; }
            10% { opacity: 1; }
            20% { transform: translateX(100vw) rotate(15deg); opacity: 0; }
            100% { transform: translateX(100vw) rotate(15deg); opacity: 0; }
        }

        @keyframes cinematic-intro {
            0% { opacity: 0; transform: scale(1.1) translateY(30px); filter: blur(10px); }
            100% { opacity: 1; transform: scale(1) translateY(0); filter: blur(0px); }
        }

        @keyframes fade-in-up {
            0% { opacity: 0; transform: translateY(20px) translateZ(30px); }
            100% { opacity: 1; transform: translateY(0) translateZ(30px); }
        }

        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.5; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }

        @keyframes ripple-anim {
            to { transform: scale(4); opacity: 0; }
        }

        @keyframes shockwave-expand {
            0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 6px; }
            50% { opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(4); opacity: 0; border-width: 1px; }
        }

        @media (max-width: 768px) {
            .title { font-size: 2.3rem; }
            .subtitle { font-size: 1.1rem; }
            .glass-card { padding: 40px 20px; }
            .profile-wrapper { width: 110px; height: 110px; }
        }
        @media (max-width: 480px) {
            .title { font-size: 1.9rem; }
            .cta-btn { width: 100%; max-width: 250px; }
        }
    </style>
</head>
<body>

    <!-- Dynamic Canvas Background (Stars & Gravity Particles) -->
    <canvas id="canvas-container"></canvas>

    <!-- Fog and Ambient Lights -->
    <div class="fog-container"></div>
    <div class="ambient-glow"></div>

    <!-- Fast Moving Neon Streaks -->
    <div class="streaks-container" id="streaks">
        <div class="streak" style="top: 20%; animation-delay: 0s;"></div>
        <div class="streak" style="top: 60%; animation-delay: 2s; background: linear-gradient(90deg, transparent, var(--neon-orange), #fff, var(--neon-orange), transparent);"></div>
        <div class="streak" style="top: 80%; animation-delay: 1.5s; background: linear-gradient(90deg, transparent, var(--neon-pink), #fff, var(--neon-pink), transparent);"></div>
    </div>

    <!-- Mouse Tracking Lens Flare -->
    <div id="cursor-flare"></div>

    <!-- Centerpiece -->
    <main class="main-container" id="main-container">
        <div class="glass-card" id="glass-card">
            
            <div class="profile-wrapper">
                <div class="profile-anim-border"></div>
                <img src="VT.png" alt="Game Logo" class="profile-img">
            </div>

            <h1 class="title">VORTEX<br>TOUR</h1>
            <p class="subtitle">Free Fire Tournament.
            <br> Join custom matches, fight with real players, and earn rewards based purely on your gaming skills.</p>
            
            <div class="cta-container">
                <a href="https://www.dropbox.com/scl/fi/7mlvn14rgq8yktocinmzf/Vortex-Tour.apk?rlkey=nbgdlpatn78z0hsf0rti68ecw&st=ub035spg&dl=1" target="_blank" class="cta-btn" id="cta-btn" download=>
                    <span>DOWNLOAD APP</span>
                </a>
            </div>

            <p class="footer-text">© Vortex Tour 2026. All rights reserved.</p>
        </div>
    </main>

    <script>
        // === CANVAS PARTICLE & STARFIELD SYSTEM (EXACT FROM PROVIDED CODE) ===
        const canvas = document.getElementById('canvas-container');
        const ctx = canvas.getContext('2d');
        let width, height;
        let particles = [];
        let stars = [];
        
        // New array for Global Click Sparks
        let clickSparks = [];

        // Mouse Object for interaction (Gravity/Repel Effect)
        const mouse = { x: window.innerWidth / 2, y: window.innerHeight / 2, radius: 150 };

        function initCanvas() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            particles = [];
            stars = [];
            
            // Create Stars (Static Parallax Background)
            for(let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * width,
                    y: Math.random() * height,
                    radius: Math.random() * 1.5,
                    alpha: Math.random(),
                    speed: Math.random() * 0.5 + 0.1
                });
            }

            // Create Floating Particles (Foreground Interactive Gravity)
            for(let i = 0; i < 80; i++) {
                particles.push(new Particle());
            }
        }

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 2.5 + 0.5;
                this.density = (Math.random() * 30) + 1;
                // Free Fire Vibe Colors
                const pColors = ['#00f3ff', '#ff6a00', '#ff107a'];
                this.color = pColors[Math.floor(Math.random() * pColors.length)];
                this.vx = (Math.random() - 0.5) * 1;
                this.vy = (Math.random() - 0.5) * 1;
            }
            
            draw() {
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.closePath();
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 10;
                ctx.shadowColor = this.color;
                ctx.fill();
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;

                if(this.x > width) this.x = 0;
                if(this.x < 0) this.x = width;
                if(this.y > height) this.y = 0;
                if(this.y < 0) this.y = height;

                // GRAVITY / REPEL LOGIC FROM MOUSE OR GYROSCOPE
                let dx = mouse.x - this.x;
                let dy = mouse.y - this.y;
                let distance = Math.sqrt(dx * dx + dy * dy);
                let forceDirectionX = dx / distance;
                let forceDirectionY = dy / distance;
                let maxDistance = mouse.radius;
                let force = (maxDistance - distance) / maxDistance;
                let directionX = forceDirectionX * force * this.density;
                let directionY = forceDirectionY * force * this.density;

                if (distance < mouse.radius) {
                    this.x -= directionX;
                    this.y -= directionY;
                }

                this.draw();
            }
        }

        // Global Spark Class for Click Event
        class Spark {
            constructor(x, y) {
                this.x = x;
                this.y = y;
                let angle = Math.random() * Math.PI * 2;
                let speed = Math.random() * 12 + 4; 
                this.vx = Math.cos(angle) * speed;
                this.vy = Math.sin(angle) * speed;
                const colors = ['#00f3ff', '#ff6a00', '#ff107a'];
                this.color = colors[Math.floor(Math.random() * colors.length)];
                this.alpha = 1;
                this.size = Math.random() * 2.5 + 1.5;
            }
            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vx *= 0.92; 
                this.vy *= 0.92;
                this.alpha -= 0.025; 
            }
            draw(ctx) {
                ctx.save();
                ctx.globalAlpha = Math.max(0, this.alpha);
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fillStyle = this.color;
                ctx.shadowBlur = 15;
                ctx.shadowColor = this.color;
                ctx.fill();
                ctx.restore();
            }
        }

        function animateCanvas() {
            ctx.clearRect(0, 0, width, height);
            
            ctx.shadowBlur = 0; 
            stars.forEach(star => {
                let shiftX = (mouse.x - width/2) * 0.01 * star.speed;
                let shiftY = (mouse.y - height/2) * 0.01 * star.speed;
                
                ctx.fillStyle = `rgba(255, 255, 255, ${star.alpha})`;
                ctx.beginPath();
                ctx.arc(star.x - shiftX, star.y - shiftY, star.radius, 0, Math.PI * 2);
                ctx.fill();

                star.alpha += (Math.random() - 0.5) * 0.05;
                if(star.alpha < 0) star.alpha = 0;
                if(star.alpha > 1) star.alpha = 1;
            });

            particles.forEach(p => p.update());

            for (let i = clickSparks.length - 1; i >= 0; i--) {
                clickSparks[i].update();
                clickSparks[i].draw(ctx);
                if (clickSparks[i].alpha <= 0) {
                    clickSparks.splice(i, 1);
                }
            }

            requestAnimationFrame(animateCanvas);
        }

        window.addEventListener('resize', initCanvas);
        initCanvas();
        animateCanvas();

        // === 3D CARD TILT & MOUSE TRACKING ===
        const card = document.getElementById('glass-card');
        const cursorFlare = document.getElementById('cursor-flare');

        let targetX = width / 2;
        let targetY = height / 2;
        let currentX = width / 2;
        let currentY = height / 2;

        window.addEventListener('mousemove', (e) => {
            targetX = e.clientX;
            targetY = e.clientY;
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        // Mobile device tilt (Gyroscope logic exactly as requested)
        window.addEventListener("deviceorientation", (e) => {
            if (e.beta && e.gamma) {
                targetX = width/2 + (e.gamma * 10); 
                targetY = height/2 + ((e.beta - 45) * 10); 
                mouse.x = targetX;
                mouse.y = targetY;
            }
        });

        function updateInteractions() {
            currentX += (targetX - currentX) * 0.1;
            currentY += (targetY - currentY) * 0.1;

            cursorFlare.style.left = `${currentX}px`;
            cursorFlare.style.top = `${currentY}px`;

            const centerX = width / 2;
            const centerY = height / 2;
            
            const rotateY = ((currentX - centerX) / centerX) * 12; 
            const rotateX = -((currentY - centerY) / centerY) * 12; 

            const floatY = Math.sin(Date.now() * 0.002) * 10;
            card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) translateY(${floatY}px)`;
            
            requestAnimationFrame(updateInteractions);
        }
        updateInteractions();

        // === CTA BUTTON RIPPLE EFFECT ===
        const btn = document.getElementById('cta-btn');
        btn.addEventListener('click', function(e) {
            let ripple = document.createElement('div');
            ripple.classList.add('ripple');
            this.appendChild(ripple);
            
            let rect = this.getBoundingClientRect();
            let x = e.clientX - rect.left;
            let y = e.clientY - rect.top;
            
            ripple.style.left = `${x}px`;
            ripple.style.top = `${y}px`;
            
            let size = Math.max(rect.width, rect.height);
            ripple.style.width = ripple.style.height = `${size}px`;
            ripple.style.transform = `translate(-50%, -50%) scale(0)`;
            
            createExplosion(e.clientX, e.clientY);

            setTimeout(() => {
                ripple.remove();
            }, 600);
        });

        function createExplosion(x, y) {
            for(let i=0; i<15; i++) {
                let p = new Particle();
                p.x = x;
                p.y = y;
                p.vx = (Math.random() - 0.5) * 10;
                p.vy = (Math.random() - 0.5) * 10;
                p.color = '#fff';
                particles.push(p);
                setTimeout(() => {
                    particles.pop();
                }, 1000);
            }
        }

        // === GLOBAL CLICK EFFECT (ANYWHERE ON PAGE EXCEPT BUTTON) ===
        window.addEventListener('click', function(e) {
            if (e.target.closest('#cta-btn')) return;

            const shockwave = document.createElement('div');
            shockwave.classList.add('global-shockwave');
            shockwave.style.left = `${e.clientX}px`;
            shockwave.style.top = `${e.clientY}px`;
            
            const colors = ['var(--neon-blue)', 'var(--neon-orange)', 'var(--neon-pink)'];
            const randomColor = colors[Math.floor(Math.random() * colors.length)];
            shockwave.style.boxShadow = `0 0 30px ${randomColor}, inset 0 0 30px ${randomColor}`;
            shockwave.style.borderColor = randomColor;

            document.body.appendChild(shockwave);

            setTimeout(() => {
                shockwave.remove();
            }, 800);

            for(let i = 0; i < 25; i++) {
                clickSparks.push(new Spark(e.clientX, e.clientY));
            }
        });
    </script>
</body>
</html>
